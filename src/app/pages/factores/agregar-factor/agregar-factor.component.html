<div [@routeAnimation] class="card card--panel perm-wrapper">
  <header class="perm-head perm-head--left" role="region" aria-label="Sección: Factores">
    <div class="perm-head__icon" aria-hidden="true">
      <mat-icon>straighten</mat-icon>
    </div>
    <div class="perm-head__text">
      <span class="eyebrow">Sección</span>
      <h2>{{ title }}</h2>
    </div>
    <nav class="perm-head__crumbs" aria-label="Ruta">
      <span class="crumb">Administración</span>
      <span class="sep">/</span>
      <span class="crumb active">Factores</span>
    </nav>
  </header>

  <div class="surface">
    <section class="perm-form-nc container-fluid py-4">
      <form [formGroup]="factorForm" class="perm-form-body">
        <div class="row g-4">

          <!-- Variable -->
          <div class="col-12 col-md-4">
            <label for="facVariable" class="form-label perm-label">Nombre de la variable</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">title</mat-icon>
              </span>
              <div class="form-floating flex-grow-1">
                <input
                  type="text"
                  formControlName="variable"
                  class="form-control"
                  id="facVariable"
                  placeholder="Ej.: INPC_ACTUAL"
                  required
                  autocomplete="off"
                  style="text-transform: uppercase;"
                />
                <label for="facVariable">Ej.: INPC_ACTUAL, RENTA_BASE</label>
              </div>
            </div>
            <p class="small opacity-50 mt-1 mb-0">
              Use solo letras mayúsculas, números y guiones bajos
            </p>
          </div>

          <!-- Valor -->
          <div class="col-12 col-md-4">
            <label for="facValor" class="form-label perm-label">Valor</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">pin</mat-icon>
              </span>
              <div class="form-floating flex-grow-1">
                <input
                  type="text"
                  autocomplete="off"
                  formControlName="valor"
                  class="form-control"
                  id="facValor"
                  placeholder=" "
                  (input)="onValorInput($event)"
                />
                <label for="facValor">Ej.: 140.0000 o 75,000</label>
              </div>
            </div>
          </div>

          <!-- Descripción -->
          <div class="col-12 col-md-4">
            <label for="facDescripcion" class="form-label perm-label">
              Descripción <span class="opacity-50 fw-normal">(opcional)</span>
            </label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">notes</mat-icon>
              </span>
              <div class="form-floating flex-grow-1">
                <input
                  type="text"
                  formControlName="descripcion"
                  class="form-control"
                  id="facDescripcion"
                  placeholder="Ej.: INPC junio 2025"
                  autocomplete="off"
                />
                <label for="facDescripcion">Explique brevemente para qué sirve este factor</label>
              </div>
            </div>
          </div>

        </div>

        <div class="d-flex flex-wrap gap-3 justify-content-start mt-4">
          <button class="button-success" role="button" (click)="submit()" [disabled]="loading">
            <i class="fa fa-check"></i>&nbsp;&nbsp;{{ submitButton }}
          </button>
          <button type="button" class="button-danger" (click)="regresar()" [disabled]="loading">
            <i class="fa fa-times"></i>&nbsp;&nbsp;Cancelar
          </button>
        </div>
      </form>
    </section>
  </div>
</div>
