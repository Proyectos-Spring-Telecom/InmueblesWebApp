<div [@routeAnimation] class="card card--panel perm-wrapper">
  <app-module-hero icon="straighten" eyebrow="Administración" [titulo]="title"
    descripcion="Captura el factor presupuestal y su valor. Los campos con * son obligatorios."></app-module-hero>

  <div class="surface">
    <section class="perm-form-nc container-fluid py-4 factor-form">
      <form [formGroup]="factorForm" class="perm-form-body">
        <div class="inpc-filtros-panel w-100 mb-4">
          <p class="factor-form__aviso small opacity-50 mb-2 mb-md-3">
            Rango de consulta del catálogo INPC (por defecto, año vigente). Puede ajustarlo y volver a consultar.
          </p>
          <div class="inpc-filtros-panel__grid">
            <div>
              <label class="form-label mb-1 inpc-filtro-fechas__label" for="facInpcFechaInicio">
                Fecha inicio
              </label>
              <app-campo-fecha inputId="facInpcFechaInicio" class="campo-dx--sm" placeholder="dd/mm/aaaa"
                [(ngModel)]="fechaInicioFiltro" [ngModelOptions]="{ standalone: true }"></app-campo-fecha>
            </div>
            <div>
              <label class="form-label mb-1 inpc-filtro-fechas__label" for="facInpcFechaFin">
                Fecha fin
              </label>
              <app-campo-fecha inputId="facInpcFechaFin" class="campo-dx--sm" placeholder="dd/mm/aaaa"
                [(ngModel)]="fechaFinFiltro" [ngModelOptions]="{ standalone: true }"></app-campo-fecha>
            </div>
            <div class="inpc-filtros-panel__accion">
              <button
                type="button"
                (click)="aplicarFiltrosInpcCatalogo()"
                mat-flat-button
                class="bg-primary inpc-filtros-panel__btn"
                [disabled]="cargandoInpc"
              >
                <i class="fa fa-filter"></i> Consultar INPC
              </button>
            </div>
          </div>
        </div>

        <div class="row g-4 factor-form__campos">

          <!-- Variable -->
          <div class="col-12 col-md-6 col-xl-3">
            <label for="facVariable" class="form-label perm-label">Variable</label>
            <div class="input-group input-group-lg perm-ig factor-form__ig">
              <span class="input-group-text">
                <mat-icon aria-hidden="true">code</mat-icon>
              </span>
              <div
                class="form-floating flex-grow-1"
                [class.factor-form__floating--filled]="!!factorForm.get('variable')?.value"
              >
                <input
                  type="text"
                  formControlName="variable"
                  class="form-control"
                  id="facVariable"
                  placeholder=" "
                  autocomplete="off"
                />
                <label for="facVariable">Ej.: FactorA</label>
              </div>
            </div>
          </div>

          <!-- Periodo INPC (año + mes) -->
          <div class="col-12 col-md-6 col-xl-3">
            <label for="facInpc" class="form-label perm-label">Periodo INPC</label>
            <div class="input-group input-group-lg perm-ig factor-form__ig">
              <span class="input-group-text">
                <mat-icon aria-hidden="true">calendar_month</mat-icon>
              </span>
              <app-campo-select inputId="facInpc" formControlName="inpcId" ariaLabel="Seleccionar periodo INPC"
                [disabled]="cargandoInpc || inpcOpciones.length === 0" label="Mes y año del INPC"
                [placeholder]="cargandoInpc ? 'Cargando INPC…' : 'Selecciona mes y año'"
                [items]="inpcOpciones" valueExpr="id" [displayExpr]="etiquetaOpcionInpcSelect"></app-campo-select>
            </div>
            <p class="factor-form__aviso small opacity-50 mt-2 mb-0" *ngIf="!cargandoInpc && inpcOpciones.length === 0">
              No hay registros de INPC en el rango seleccionado.
            </p>
          </div>

          <!-- Valor: INPC o porcentaje anual del periodo seleccionado -->
          <div class="col-12 col-md-6 col-xl-3">
            <label for="facValor" class="form-label perm-label">Valor</label>
            <div class="input-group input-group-lg perm-ig factor-form__ig">
              <span class="input-group-text">
                <mat-icon aria-hidden="true">pin</mat-icon>
              </span>
              <app-campo-select inputId="facValor" formControlName="valor" ariaLabel="Seleccionar valor del periodo INPC"
                label="INPC o % anual" [placeholder]="inpcSeleccionado ? 'Selecciona el valor' : 'Primero elige el periodo'"
                [items]="opcionesValorInpc" valueExpr="id" displayExpr="nombre" [buscar]="false"></app-campo-select>
            </div>
          </div>

          <!-- Descripción -->
          <div class="col-12 col-md-6 col-xl-3">
            <label for="facDescripcion" class="form-label perm-label">
              Descripción <span class="opacity-50">(opcional)</span>
            </label>
            <div class="input-group input-group-lg perm-ig factor-form__ig">
              <span class="input-group-text">
                <mat-icon aria-hidden="true">notes</mat-icon>
              </span>
              <div
                class="form-floating flex-grow-1"
                [class.factor-form__floating--filled]="!!factorForm.get('descripcion')?.value"
              >
                <input
                  type="text"
                  formControlName="descripcion"
                  class="form-control"
                  id="facDescripcion"
                  placeholder=" "
                  autocomplete="off"
                />
                <label for="facDescripcion">Descripción del factor</label>
              </div>
            </div>
          </div>

        </div>

        <div class="factor-form__acciones d-flex flex-wrap gap-3 justify-content-start mt-4">
          <button class="button-success factor-form__btn" role="button" (click)="submit()" [disabled]="loading">
            <i class="fa fa-check"></i>&nbsp;&nbsp;{{ submitButton }}
          </button>
          <button type="button" class="button-danger factor-form__btn" (click)="regresar()" [disabled]="loading">
            <i class="fa fa-times"></i>&nbsp;&nbsp;Cancelar
          </button>
        </div>
      </form>
    </section>
  </div>
</div>
