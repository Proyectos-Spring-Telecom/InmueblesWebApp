<div [@routeAnimation] class="card card--panel perm-wrapper">
  <header class="perm-head perm-head--left" role="region" aria-label="Sección: Factores">
    <div class="perm-head__icon" aria-hidden="true">
      <mat-icon>straighten</mat-icon>
    </div>
    <div class="perm-head__text">
      <span class="eyebrow">Sección</span>
      <h2>{{ title }}</h2>
    </div>
    <nav class="perm-head__crumbs" aria-label="Ruta">
      <span class="crumb">Administración</span>
      <span class="sep">/</span>
      <span class="crumb active">Factores</span>
    </nav>
  </header>

  <div class="surface">
    <section class="perm-form-nc container-fluid py-4 factor-form">
      <form [formGroup]="factorForm" class="perm-form-body">
        <div class="inpc-filtros-panel w-100 mb-4">
          <div class="inpc-filtros-panel__grid">
            <div>
              <label class="form-label mb-1 inpc-filtro-fechas__label" for="facInpcFechaInicio">
                Fecha inicio
              </label>
              <input
                id="facInpcFechaInicio"
                type="date"
                class="form-control form-control-sm inpc-filtro-fechas__input"
                [(ngModel)]="fechaInicioFiltro"
                [ngModelOptions]="{ standalone: true }"
              />
            </div>
            <div>
              <label class="form-label mb-1 inpc-filtro-fechas__label" for="facInpcFechaFin">
                Fecha fin
              </label>
              <input
                id="facInpcFechaFin"
                type="date"
                class="form-control form-control-sm inpc-filtro-fechas__input"
                [(ngModel)]="fechaFinFiltro"
                [ngModelOptions]="{ standalone: true }"
              />
            </div>
            <div class="inpc-filtros-panel__accion">
              <button
                type="button"
                (click)="aplicarFiltrosInpcCatalogo()"
                mat-flat-button
                class="bg-primary inpc-filtros-panel__btn"
                [disabled]="cargandoInpc"
              >
                <i class="fa fa-filter"></i> Consultar INPC
              </button>
            </div>
          </div>
        </div>

        <div class="row g-4 factor-form__campos">

          <!-- INPC -->
          <div class="col-12 col-md-4">
            <label for="facInpc" class="form-label perm-label">INPC</label>
            <div class="input-group input-group-lg perm-ig factor-form__ig">
              <span class="input-group-text">
                <mat-icon aria-hidden="true">show_chart</mat-icon>
              </span>
              <div
                class="form-floating flex-grow-1 perm-select-floating factor-inpc-select"
                [class.factor-inpc-select--filled]="!!inpcSeleccionado"
              >
                <select
                  class="form-select"
                  id="facInpc"
                  formControlName="inpcId"
                  aria-label="Seleccionar INPC"
                  [disabled]="cargandoInpc || inpcOpciones.length === 0"
                >
                  <option [ngValue]="null" disabled>
                    {{ cargandoInpc ? 'Cargando INPC…' : 'Selecciona un INPC' }}
                  </option>
                  <option *ngFor="let row of inpcOpciones" [ngValue]="row.id">
                    {{ etiquetaOpcionInpc(row) }}
                  </option>
                </select>
                <label for="facInpc">Selecciona un INPC</label>
              </div>
            </div>
            <p class="factor-form__aviso small opacity-50 mt-2 mb-0" *ngIf="!cargandoInpc && inpcOpciones.length === 0">
              No hay registros de INPC disponibles.
            </p>
            <div class="factor-inpc-meta mt-2" *ngIf="inpcSeleccionado">
              <span class="factor-inpc-meta__badge" [ngClass]="inpcSeleccionado.origenClass">
                {{ inpcSeleccionado.origenLabel }}
              </span>
            </div>
          </div>

          <!-- Valor -->
          <div class="col-12 col-md-4">
            <label for="facValor" class="form-label perm-label">Valor</label>
            <div class="input-group input-group-lg perm-ig factor-form__ig">
              <span class="input-group-text">
                <mat-icon aria-hidden="true">pin</mat-icon>
              </span>
              <div
                class="form-floating flex-grow-1"
                [class.factor-form__floating--filled]="!!factorForm.get('valor')?.value"
              >
                <input
                  type="text"
                  autocomplete="off"
                  formControlName="valor"
                  class="form-control"
                  id="facValor"
                  placeholder=" "
                  (input)="onValorInput($event)"
                />
                <label for="facValor">Índice del INPC</label>
              </div>
            </div>
          </div>

          <!-- Descripción -->
          <div class="col-12 col-md-4">
            <label for="facDescripcion" class="form-label perm-label">
              Descripción <span class="opacity-50">(opcional)</span>
            </label>
            <div class="input-group input-group-lg perm-ig factor-form__ig">
              <span class="input-group-text">
                <mat-icon aria-hidden="true">notes</mat-icon>
              </span>
              <div
                class="form-floating flex-grow-1"
                [class.factor-form__floating--filled]="!!factorForm.get('descripcion')?.value"
              >
                <input
                  type="text"
                  formControlName="descripcion"
                  class="form-control"
                  id="facDescripcion"
                  placeholder=" "
                  autocomplete="off"
                />
                <label for="facDescripcion">Ej.: INPC mayo 2026</label>
              </div>
            </div>
          </div>

        </div>

        <div class="factor-form__acciones d-flex flex-wrap gap-3 justify-content-start mt-4">
          <button class="button-success factor-form__btn" role="button" (click)="submit()" [disabled]="loading">
            <i class="fa fa-check"></i>&nbsp;&nbsp;{{ submitButton }}
          </button>
          <button type="button" class="button-danger factor-form__btn" (click)="regresar()" [disabled]="loading">
            <i class="fa fa-times"></i>&nbsp;&nbsp;Cancelar
          </button>
        </div>
      </form>
    </section>
  </div>
</div>
