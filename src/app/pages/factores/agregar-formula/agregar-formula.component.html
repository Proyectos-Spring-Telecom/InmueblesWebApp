<div [@routeAnimation] class="card card--panel perm-wrapper">
  <header class="perm-head perm-head--left" role="region" aria-label="Sección: Fórmulas">
    <div class="perm-head__icon" aria-hidden="true">
      <mat-icon>functions</mat-icon>
    </div>
    <div class="perm-head__text">
      <span class="eyebrow">Sección</span>
      <h2>{{ title }}</h2>
    </div>
    <nav class="perm-head__crumbs" aria-label="Ruta">
      <span class="crumb">Administración</span>
      <span class="sep">/</span>
      <span class="crumb active">Fórmulas</span>
    </nav>
  </header>
  <div class="surface">
    <section class="perm-form-nc container-fluid py-4">
      <form [formGroup]="formulaForm" class="perm-form-body">
        <div class="row g-4">
          <div class="col-12 col-md-6">
            <label for="forNombre" class="form-label perm-label">Nombre</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">title</mat-icon>
              </span>
              <div class="form-floating flex-grow-1">
                <input
                  type="text"
                  formControlName="nombre"
                  class="form-control"
                  id="forNombre"
                  placeholder="Ej.: Renta con INPC"
                  required
                />
                <label for="forNombre">Nombre mostrado en el grid</label>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label for="facSelFactorFormula" class="form-label perm-label">Factor</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">straighten</mat-icon>
              </span>
              <div class="form-floating flex-grow-1 perm-select-floating">
                <select
                  class="form-select"
                  id="facSelFactorFormula"
                  name="facSelFactorFormula"
                  [(ngModel)]="factorSeleccionadoParaFormula"
                  [ngModelOptions]="{ standalone: true }"
                  (ngModelChange)="onFactorSelectParaFormula($event)"
                  [disabled]="cargandoVariablesFactores || !factoresParaSelectFormula.length"
                >
                  <option value="">Seleccione factor…</option>
                  <option *ngFor="let f of factoresParaSelectFormula" [value]="f.variable">
                    {{ f.etiqueta }}
                  </option>
                </select>
                <label for="facSelFactorFormula">Insertar variable en la fórmula</label>
              </div>
            </div>
            <p class="small opacity-75 mt-2 mb-0" *ngIf="cargandoVariablesFactores">Cargando factores…</p>
            <p class="small opacity-75 mt-2 mb-0" *ngIf="!cargandoVariablesFactores && !factoresParaSelectFormula.length">
              No hay factores activos; registre variables en Factores y recargue.
            </p>
          </div>
        </div>

        <div class="d-flex flex-wrap gap-3 justify-content-start mt-4">
          <button class="button-success" role="button" (click)="submit()">
            <i class="fa fa-check"></i>&nbsp;&nbsp;{{ submitButton }}
          </button>
          <button type="button" class="button-danger" (click)="regresar()">
            <i class="fa fa-times">&nbsp;&nbsp;</i>Cancelar
          </button>
        </div>
      </form>
    </section>
  </div>
</div>
