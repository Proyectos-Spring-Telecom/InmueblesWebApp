<div [@routeAnimation] class="card card--panel perm-wrapper">
    <app-module-hero icon="view_module" eyebrow="Administración" [titulo]="title"
      descripcion="Captura los datos de la instalación. Los campos con * son obligatorios."></app-module-hero>

    <div class="surface">
        <section class="perm-form-nc container-id py-4">
            <form [formGroup]="insEquipoForm" class="perm-form-body">
                <div class="row g-4">
                    <div class="col-12 col-md-4">
                        <label for="idEquipo" class="form-label perm-label">Equipo</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">devices_other</mat-icon>
                            </span>
                            <app-campo-select inputId="idEquipo" formControlName="idEquipo" label="Selecciona un equipo"
                                placeholder="Selecciona un equipo" [items]="listaEquipos" valueExpr="id"
                                displayExpr="numeroSerie"></app-campo-select>
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="idCliente" class="form-label perm-label">Arrendador</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">person</mat-icon>
                            </span>
                            <app-campo-select inputId="idCliente" formControlName="idCliente" label="Selecciona cuenta padre"
                                placeholder="Selecciona un arrendador" [items]="listaClientes" valueExpr="id"
                                [displayExpr]="etiquetaClienteSelect"></app-campo-select>
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="idSedeCentral" class="form-label perm-label">Instalación Central</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">location_city</mat-icon>
                            </span>
                            <app-campo-select inputId="idSedeCentral" formControlName="idSedeCentral"
                                label="Selecciona una instalación central" placeholder="Selecciona una instalación principal"
                                [items]="listaSedeCentrales" valueExpr="id" displayExpr="nombre"
                                (cambio)="onSedeCentralChange()"></app-campo-select>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="nroPiso" class="form-label perm-label">Piso</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">layers</mat-icon>
                            </span>
                            <app-campo-select inputId="nroPiso" formControlName="nroPiso"
                                [disabled]="!insEquipoForm.get('idSedeCentral')?.value" label="Selecciona un piso"
                                placeholder="Selecciona un piso" [items]="listaPisos" valueExpr="id"
                                [displayExpr]="etiquetaPisoSelect"></app-campo-select>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="idDepartamento" class="form-label perm-label">Departamento</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">business</mat-icon>
                            </span>
                            <app-campo-select inputId="idDepartamento" formControlName="idDepartamento"
                                label="Selecciona un departamento" placeholder="Selecciona un departamento" [limpiable]="true"
                                [items]="listaDepartamentos" valueExpr="id" displayExpr="nombre"></app-campo-select>
                        </div>
                    </div>
                    <div class="col-12 mt-3">
                        <div id="map"></div>
                    </div>

                </div>

                <div class="d-flex flex-wrap gap-3 justify-content-start mt-4">
                    <button class="button-success" role="button" (click)="submit()">
                        <i class="fa fa-check"></i>&nbsp;&nbsp;{{ submitButton }}
                    </button>
                    <button type="button" class="button-danger" (click)="regresar()">
                        <i class="fa fa-times">&nbsp;&nbsp;</i>Cancelar
                    </button>
                </div>
            </form>
        </section>
    </div>
</div>
