<div [@routeAnimation] class="card card--panel perm-wrapper operacion-pagos-hub">
  <app-module-hero icon="payments" eyebrow="Operación · Arrendatarios" titulo="Pagos de renta"
    descripcion="Elige si quieres ver las rentas del mes o el histórico de pagos."></app-module-hero>

  <nav class="operacion-pagos-hub__segmentos" role="tablist" aria-label="Pagos de renta">
    <a
      class="operacion-pagos-hub__segmento"
      [class.operacion-pagos-hub__segmento--activo]="segmentoActivo === 'actual'"
      routerLink="/arrendatarios/pagos-renta/actual"
      routerLinkActive="operacion-pagos-hub__segmento--activo"
      role="tab"
      [attr.aria-selected]="segmentoActivo === 'actual'"
    >
      <span class="operacion-pagos-hub__segmento-icono" aria-hidden="true">
        <mat-icon>event_available</mat-icon>
      </span>
      <span class="operacion-pagos-hub__segmento-texto">
        <span class="operacion-pagos-hub__segmento-titulo">Mes en curso</span>
        <span class="operacion-pagos-hub__segmento-desc">Registrar rentas del periodo y marcar pagos</span>
      </span>
    </a>
    <a
      class="operacion-pagos-hub__segmento"
      [class.operacion-pagos-hub__segmento--activo]="segmentoActivo === 'historico'"
      routerLink="/arrendatarios/pagos-renta/historico"
      routerLinkActive="operacion-pagos-hub__segmento--activo"
      role="tab"
      [attr.aria-selected]="segmentoActivo === 'historico'"
    >
      <span class="operacion-pagos-hub__segmento-icono" aria-hidden="true">
        <mat-icon>history</mat-icon>
      </span>
      <span class="operacion-pagos-hub__segmento-texto">
        <span class="operacion-pagos-hub__segmento-titulo">Histórico</span>
        <span class="operacion-pagos-hub__segmento-desc">Consultar pagos cerrados por rango de fechas</span>
      </span>
    </a>
  </nav>

  <div class="operacion-pagos-hub__cuerpo">
    <router-outlet></router-outlet>
  </div>
</div>
