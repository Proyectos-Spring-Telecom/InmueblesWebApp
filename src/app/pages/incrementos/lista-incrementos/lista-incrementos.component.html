<div [@routeAnimation] class="card card--panel perm-wrapper">
  <app-module-hero icon="receipt_long" eyebrow="Administración · INPC" titulo="INPC"
    descripcion="Consulta el histórico del INPC que se usa para calcular los incrementos de renta."></app-module-hero>

  <div class="surface">
    <div class="inpc-filtros-panel w-100">
      <div class="inpc-filtros-panel__grid">
        <div>
          <label class="form-label mb-1 inpc-filtro-fechas__label" for="inpcFechaInicio">Fecha inicio <span
              class="text-danger">*</span></label>
          <app-campo-fecha inputId="inpcFechaInicio" class="campo-dx--sm" placeholder="dd/mm/aaaa"
            [(ngModel)]="fechaInicioFiltro"></app-campo-fecha>
        </div>
        <div>
          <label class="form-label mb-1 inpc-filtro-fechas__label" for="inpcFechaFin">Fecha fin <span
              class="text-danger">*</span></label>
          <app-campo-fecha inputId="inpcFechaFin" class="campo-dx--sm" placeholder="dd/mm/aaaa"
            [(ngModel)]="fechaFinFiltro"></app-campo-fecha>
        </div>
        <div class="inpc-filtros-panel__accion">
          <button type="button" (click)="aplicarFiltros()" mat-flat-button class="bg-primary">
            <i class="fa fa-filter"></i> Consultar
          </button>
        </div>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-10 justify-content-end w-100 mt-3">
      <!-- <div *appHasPermission="'17'">
        <button (click)="agregarIncremento()" mat-flat-button class="bg-secondary">
          <i class="fa fa-plus"></i> Agregar INPC</button>
      </div> -->
      <button (click)="limpiarCampos()" mat-flat-button class="bg-success"><i class="fa fa-eraser"></i> Limpiar</button>
      <button (click)="toggleExpandGroups()" mat-flat-button class="bg-warn">
        <i [class]="autoExpandAllGroups ? 'fa fa-expand' : 'fa fa-compress'" aria-hidden="true"></i>
        {{ autoExpandAllGroups ? ' Contraer Grupos' : ' Expandir Grupos' }}
      </button>
      <button type="button" (click)="exportarExcel()" mat-flat-button class="bg-info" [disabled]="!puedeExportarExcel()">
        <i class="fa fa-file-excel-o" aria-hidden="true"></i> Exportar
      </button>
    </div>
    <div class="mt-3">
      <dx-data-grid #gridContainer id="gridIncrementos" class="inm-data-grid" [columnHidingEnabled]="false"
        [hoverStateEnabled]="false" [showBorders]="true" [showColumnLines]="false" [showRowLines]="true"
        [rowAlternationEnabled]="true" [dataSource]="listaIncrementos" [keyExpr]="'id'" [width]="'100%'"
        [remoteOperations]="{ paging: true }" [paging]="{ pageSize: pageSize }"
        [noDataText]="'Sin registros para mostrar'" [pager]="{
          showPageSizeSelector: true,
          allowedPageSizes: [20],
          showInfo: true,
          showNavigationButtons: true,
          visible: true
        }" (onPageIndexChanged)="onPageIndexChanged($event)" (onOptionChanged)="onGridOptionChanged($event)">
        <dxo-search-panel [visible]="true" [width]="240" placeholder="Buscar..."></dxo-search-panel>
        <dxo-group-panel [emptyPanelText]="mensajeAgrupar" [visible]="true"></dxo-group-panel>
        <dxo-filter-row [visible]="showFilterRow"></dxo-filter-row>
        <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
        <dxo-grouping #expand [autoExpandAll]="autoExpandAllGroups"></dxo-grouping>
        <dxi-column dataField="fecha" caption="Fecha" alignment="center" dataType="string"></dxi-column>
        <dxi-column dataField="origenLabel" caption="Origen" alignment="center" dataType="string"
          cellTemplate="origenInpcTpl"></dxi-column>
        <dxi-column dataField="inpcFmt" caption="Índice INPC" alignment="center" dataType="string"></dxi-column>
        <dxi-column dataField="porcentajeAnualFmt" caption="% Anual" alignment="center" dataType="string"></dxi-column>
        <dxi-column dataField="porcAcumAnualFmt" caption="% Acum. Anual" alignment="center"
          dataType="string"></dxi-column>

        <div *dxTemplate="let cell of 'origenInpcTpl'">
          <span [ngClass]="cell.data.origenClass">{{ cell.data.origenLabel }}</span>
        </div>
        <dxo-export [enabled]="true" [allowExportSelectedData]="true" [texts]="{
            exportAll: 'Exportar todos los datos',
            exportSelectedRows: 'Exportar filas seleccionadas'
          }">
        </dxo-export>
      </dx-data-grid>
    </div>
  </div>
</div>
