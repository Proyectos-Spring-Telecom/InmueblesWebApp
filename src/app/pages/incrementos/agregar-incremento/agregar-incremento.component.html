<div [@routeAnimation] class="card card--panel perm-wrapper">
  <app-module-hero icon="receipt_long" eyebrow="Administración · INPC" [titulo]="title"
    descripcion="Captura el valor del INPC del periodo. Los campos con * son obligatorios."></app-module-hero>
  <div class="surface">
    <section class="perm-form-nc container-fluid py-4">
      <form [formGroup]="incrementoForm" class="perm-form-body">
        <div class="row g-4">
          <div class="col-12 col-md-4">
            <label for="incAnio" class="form-label perm-label">Año</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">calendar_today</mat-icon>
              </span>
              <div class="form-floating flex-grow-1">
                <input type="text" inputmode="numeric" maxlength="4" autocomplete="off" formControlName="anio"
                  class="form-control" id="incAnio" placeholder=" " (input)="onAnioInput($event)" />
                <label for="incAnio">Ej.: 2017</label>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <label for="incMes" class="form-label perm-label">Mes</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">event</mat-icon>
              </span>
              <div class="form-floating flex-grow-1 perm-select-floating">
                <select class="form-select" id="incMes" formControlName="mes" required>
                  <option value="" disabled>Seleccione…</option>
                  <option *ngFor="let m of mesesOpciones" [value]="m">{{ m }}</option>
                </select>
                <label for="incMes">Seleccione mes</label>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <label for="incValorInpc" class="form-label perm-label">INPC</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">calculate</mat-icon>
              </span>
              <div class="form-floating flex-grow-1">
                <input type="text" inputmode="decimal" autocomplete="off" formControlName="valorInpc"
                  class="form-control" id="incValorInpc" placeholder=" " (input)="onValorInpcInput($event)" />
                <label for="incValorInpc">Valor del índice (ej.: 126.091)</label>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <label for="incPorcentajeAnual" class="form-label perm-label">% Anual</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text fw-bold">
                <mat-icon aria-hidden="true">percent</mat-icon>
              </span>
              <div class="form-floating flex-grow-1">
                <input type="text" inputmode="decimal" autocomplete="off" formControlName="porcentajeAnual"
                  class="form-control" id="incPorcentajeAnual" placeholder=" " />
                <label for="incPorcentajeAnual">Porcentaje anual (ej.: 3.79)</label>
              </div>
            </div>
          </div>
        </div>
        <div class="d-flex flex-wrap gap-3 justify-content-start mt-4">
          <button class="button-success" role="button" (click)="submit()">
            <i class="fa fa-check"></i>&nbsp;&nbsp;{{ submitButton }}
          </button>
          <button type="button" class="button-danger" (click)="regresar()">
            <i class="fa fa-times">&nbsp;&nbsp;</i>Cancelar
          </button>
        </div>
      </form>
    </section>
  </div>
</div>
