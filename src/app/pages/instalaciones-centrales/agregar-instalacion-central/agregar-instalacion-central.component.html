<div [@routeAnimation] class="modal-agregar card card--panel perm-wrapper">
    <app-module-hero icon="view_module" eyebrow="Administración" titulo="Instalaciones Centrales"
      descripcion="Captura los datos de la oficina central. Los campos con * son obligatorios."></app-module-hero>
    <div class="surface">
        <section class="perm-form-nc container-fluid py-4">
            <form [formGroup]="instForm" class="perm-form-body">
                <div class="row g-0">
                    <div class="col-12 col-md-4 mt-3">
                        <label for="idCliente" class="form-label perm-label">Arrendadores</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">account_tree</mat-icon>
                            </span>
                            <app-campo-select inputId="idCliente" formControlName="idCliente" label="Selecciona un arrendador"
                                placeholder="" [items]="listaClientes" valueExpr="id"
                                [displayExpr]="etiquetaClienteSelect"></app-campo-select>
                        </div>
                    </div>
                    <div class="col-12 col-md-4 mt-3">
                        <label for="permNombre" class="form-label perm-label">Nombre</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">title</mat-icon>
                            </span>
                            <div class="form-floating flex-grow-1">
                                <input type="text" formControlName="nombre" class="form-control" id="permNombre"
                                    placeholder="Ej.: Administración" required>
                                <label for="permNombre">Instalación Lomas</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-4 mt-3">
                        <label for="nroPisos" class="form-label perm-label">Número de Pisos</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">layers</mat-icon>
                            </span>
                            <div class="form-floating flex-grow-1">
                                <input type="number" formControlName="nroPisos" class="form-control" id="nroPisos"
                                    placeholder="Ej.: 5" min="0">
                                <label for="nroPisos">Número de pisos</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 mt-3">
                        <div id="map"></div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 justify-content-start mt-4">
                    <button (click)="submit()" class="button-success" role="button">
                        <i class="fa fa-check"></i>&nbsp;&nbsp;{{submitButton}}
                    </button>&nbsp;&nbsp;
                    <button type="button" class="button-danger" (click)="regresar()">
                        <i class="fa fa-times">&nbsp;&nbsp;</i>Cancelar
                    </button>
                </div>
            </form>
        </section>
    </div>
</div>
