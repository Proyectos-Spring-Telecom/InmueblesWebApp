<div class="inm-detalle" *ngIf="row">
  <nav class="inm-detalle__tabs" aria-label="Documentación del arrendador">
    <button
      type="button"
      class="inm-detalle__tab"
      [class.inm-detalle__tab--active]="detalleTab === 0"
      (click)="detalleTab = 0"
    >
      Documentos ({{ archivos.length }})
    </button>
    <button
      type="button"
      class="inm-detalle__tab"
      [class.inm-detalle__tab--active]="detalleTab === 1"
      (click)="detalleTab = 1"
    >
      Socios Arrendadores ({{ socios.length }})
    </button>
  </nav>

  <div class="inm-detalle__panel" *ngIf="detalleTab === 0">
    <div class="inm-docs-grid" *ngIf="archivos.length; else sinDocs">
      <article class="inm-doc-card" *ngFor="let a of archivos">
        <div
          class="inm-doc-card__thumb"
          *ngIf="a.url && esImagenArchivo(a.url, a.nombre)"
        >
          <img [src]="a.url" [attr.alt]="a.nombre" loading="lazy" />
        </div>
        <div
          class="inm-doc-card__thumb inm-doc-card__thumb--pdf"
          *ngIf="
            a.url &&
            esPdfArchivo(a.url, a.nombre) &&
            urlVistaPreviaPdf(a.url)
          "
        >
          <iframe
            [src]="urlVistaPreviaPdf(a.url)!"
            [title]="a.nombre || 'Documento PDF'"
            loading="lazy"
          ></iframe>
        </div>
        <div
          class="inm-doc-card__icon"
          *ngIf="
            !a.url ||
            (!esImagenArchivo(a.url, a.nombre) &&
              !esPdfArchivo(a.url, a.nombre))
          "
        >
          <i class="fa" [ngClass]="iconoArchivo(a.url || '', a.nombre || '')"></i>
        </div>
        <div class="inm-doc-card__info">
          <span class="inm-doc-card__name">{{ a.nombre || 'Documento' }}</span>
        </div>
        <div class="inm-doc-card__actions">
          <button
            type="button"
            mat-flat-button
            class="bg-warn inm-doc-pill"
            [title]="a.nombre || 'Documento'"
            (click)="abrirDocumento(a.url, a.nombre || 'Documento')"
            [disabled]="!a.url"
          >
            <i class="fa fa-eye"></i> Ver
          </button>
          <a
            *ngIf="a.url"
            class="bg-success inm-doc-pill inm-doc-pill--link"
            [href]="a.url"
            target="_blank"
            rel="noopener noreferrer"
            [title]="a.nombre || 'Documento'"
            [attr.download]="a.nombre || null"
          >
            <i class="fa fa-download"></i> Descargar
          </a>
        </div>
      </article>
    </div>
    <ng-template #sinDocs>
      <p class="inm-empty">Sin documentos adjuntos.</p>
    </ng-template>
  </div>

  <div class="inm-detalle__panel" *ngIf="detalleTab === 1">
    <div class="row g-3 arr-socios-grid" *ngIf="socios.length; else sinSocios">
      <div class="col-12 col-md-6 col-xl-4 d-flex" *ngFor="let so of socios; let si = index">
        <article class="arr-socio-card w-100">
        <header class="arr-socio-card__head">
          <div class="arr-socio-card__avatar" aria-hidden="true">
            <i class="fa fa-users"></i>
          </div>
          <div class="arr-socio-card__identity">
            <h4 class="arr-socio-card__nombre">{{ so['nombre'] || 'Socio ' + (si + 1) }}</h4>
            <span class="arr-socio-card__rfc" *ngIf="so['rfc']">
              <span class="arr-socio-card__rfc-label">RFC</span>
              {{ so['rfc'] }}
            </span>
          </div>
        </header>
        <!-- <p class="arr-socio-card__hint">
          Documentación del socio (constancia fiscal, domicilio e identificación).
        </p> -->
        <ul class="arr-socio-card__docs" aria-label="Documentos del socio">
          <li *ngIf="textoSocioDoc(so['constanciaSituacionFiscal'])">
            <div class="row g-2 align-items-center mx-0">
              <span class="col-12 col-sm arr-socio-doc__label">
                <i class="fa fa-file-text-o"></i> Constancia fiscal
              </span>
              <div class="col-12 col-sm-auto arr-socio-doc__actions d-flex flex-wrap justify-content-sm-end">
              <button
                type="button"
                mat-flat-button
                class="bg-warn arr-socio-doc__btn"
                (click)="
                  abrirDocumento(
                    $any(so['constanciaSituacionFiscal']),
                    'Constancia situación fiscal'
                  )
                "
              >
                <i class="fa fa-eye"></i> Ver
              </button>
              <a
                class="bg-success arr-socio-doc__link"
                [href]="$any(so['constanciaSituacionFiscal'])"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa fa-external-link"></i> Abrir
              </a>
              </div>
            </div>
          </li>
          <li *ngIf="textoSocioDoc(so['comprobanteDomicilio'])">
            <div class="row g-2 align-items-center mx-0">
              <span class="col-12 col-sm arr-socio-doc__label">
                <i class="fa fa-home"></i> Comprobante domicilio
              </span>
              <div class="col-12 col-sm-auto arr-socio-doc__actions d-flex flex-wrap justify-content-sm-end">
              <button
                type="button"
                mat-flat-button
                class="bg-warn arr-socio-doc__btn"
                (click)="abrirDocumento($any(so['comprobanteDomicilio']), 'Comprobante de domicilio')"
              >
                <i class="fa fa-eye"></i> Ver
              </button>
              <a
                class="bg-success arr-socio-doc__link"
                [href]="$any(so['comprobanteDomicilio'])"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa fa-external-link"></i> Abrir
              </a>
              </div>
            </div>
          </li>
          <li *ngIf="textoSocioDoc(so['identificacionOficial'])">
            <div class="row g-2 align-items-center mx-0">
              <span class="col-12 col-sm arr-socio-doc__label">
                <i class="fa fa-id-card-o"></i> Identificación oficial
              </span>
              <div class="col-12 col-sm-auto arr-socio-doc__actions d-flex flex-wrap justify-content-sm-end">
              <button
                type="button"
                mat-flat-button
                class="bg-warn arr-socio-doc__btn"
                (click)="abrirDocumento($any(so['identificacionOficial']), 'Identificación oficial')"
              >
                <i class="fa fa-eye"></i> Ver
              </button>
              <a
                class="bg-success arr-socio-doc__link"
                [href]="$any(so['identificacionOficial'])"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa fa-external-link"></i> Abrir
              </a>
              </div>
            </div>
          </li>
        </ul>
        </article>
      </div>
    </div>
    <ng-template #sinSocios>
      <p class="inm-empty">Sin socios arrendadores registrados.</p>
    </ng-template>
  </div>
</div>

<app-documento-preview #docPreview eyebrow="Documento del arrendador"></app-documento-preview>
