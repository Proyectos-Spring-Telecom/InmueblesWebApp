<div [@routeAnimation] class="card card--panel perm-wrapper">
  <header class="perm-head" role="region" aria-label="Sección: Servicios">
    <div class="perm-head__icon" aria-hidden="true">
      <mat-icon>design_services</mat-icon>
    </div>

    <div class="perm-head__text">
      <span class="eyebrow">Sección</span>
      <h2>Servicios</h2>
    </div>

    <nav class="perm-head__crumbs" aria-label="Ruta">
      <span class="crumb">Administración</span>
      <span class="sep">/</span>
      <span class="crumb">Servicios</span>
      <span class="sep">/</span>
      <span class="crumb active">Catálogo</span>
    </nav>
  </header>

  <div class="surface">
    <div class="d-flex flex-wrap gap-10 justify-content-end w-100">
      <div *appHasPermission="'35'">
        <button (click)="agregarServicio()" mat-flat-button class="bg-secondary">
          <i class="fa fa-plus"></i> Agregar servicio
        </button>
      </div>
      <button (click)="limpiarCampos()" mat-flat-button class="bg-success">
        <i class="fa fa-eraser"></i> Limpiar
      </button>
      <button (click)="toggleExpandGroups()" mat-flat-button class="bg-warn">
        <i [class]="autoExpandAllGroups ? 'fa fa-expand' : 'fa fa-compress'" aria-hidden="true"></i>
        {{ autoExpandAllGroups ? ' Contraer grupos' : ' Expandir grupos' }}
      </button>
      <button type="button" (click)="exportarExcel()" mat-flat-button class="bg-info" [disabled]="!puedeExportarExcel()">
        <i class="fa fa-file-excel-o" aria-hidden="true"></i> Exportar
      </button>
    </div>
    <div class="mt-3">
      <dx-data-grid
        #gridContainer
        id="gridServicios"
        class="inm-data-grid"
        [columnHidingEnabled]="false"
        [hoverStateEnabled]="false"
        [showBorders]="true"
        [showColumnLines]="false"
        [showRowLines]="true"
        [rowAlternationEnabled]="true"
        [dataSource]="listaServicios"
        [keyExpr]="'id'"
        [width]="'100%'"
        [remoteOperations]="{ paging: true }"
        [paging]="{ pageSize: pageSize }"
        [noDataText]="'Sin registros para mostrar'"
        [pager]="{
          showPageSizeSelector: true,
          allowedPageSizes: [20],
          showInfo: true,
          showNavigationButtons: true,
          visible: true
        }"
        (onPageIndexChanged)="onPageIndexChanged($event)"
        (onOptionChanged)="onGridOptionChanged($event)"
      >
        <dxo-search-panel [visible]="true" [width]="240" placeholder="Buscar..."></dxo-search-panel>
        <dxo-group-panel [emptyPanelText]="mensajeAgrupar" [visible]="true"></dxo-group-panel>
        <dxo-filter-row [visible]="showFilterRow"></dxo-filter-row>
        <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
        <dxo-grouping #expand [autoExpandAll]="autoExpandAllGroups"></dxo-grouping>
        <dxi-column
          caption="Acciones"
          cellTemplate="AccionesServicios"
          alignment="center"
          *appHasPermission="['36', '38']"
          dataType="string"
          [width]="180"
        ></dxi-column>
        <dxi-column dataField="nombre" caption="Nombre" alignment="center" dataType="string"></dxi-column>
        <dxi-column dataField="estatus" caption="Estatus" alignment="center" cellTemplate="estServicio" dataType="string">
          <div *dxTemplate="let f of 'estServicio'">
            @if (f.data.estatus === 1) {
              <span class="estatus estatus-activo">Activo</span>
            } @else {
              <span class="estatus estatus-inactivo">Inactivo</span>
            }
          </div>
        </dxi-column>
        <div *dxTemplate="let row of 'AccionesServicios'" class="d-flex gap-3 justify-content-center">
          <div *appHasPermission="'36'">
            <button
              valueExpr="id" id="actualizarButton" class="btnAcciones"
              (click)="editarServicio(row.data.id)"
            >
              <i class="fa fa-edit"></i>
            </button>
          </div>
          <div *appHasPermission="'38'">
            @if (row.data.estatus === 0) {
              <button id="pinButton" class="btnAcciones" (click)="activar(row.data)">
                  <i class="fa fa-arrow-up"></i>
              </button>
              } @else {
              <button id="deleteButton" class="btnAcciones" (click)="desactivar(row.data)">
                  <i class="fa fa-arrow-down"></i>
              </button>
              }
          </div>
        </div>
        <dxo-export
          [enabled]="true"
          [allowExportSelectedData]="true"
          [texts]="{
            exportAll: 'Exportar todos los datos',
            exportSelectedRows: 'Exportar filas seleccionadas'
          }"
        >
        </dxo-export>
      </dx-data-grid>
    </div>
  </div>
</div>
