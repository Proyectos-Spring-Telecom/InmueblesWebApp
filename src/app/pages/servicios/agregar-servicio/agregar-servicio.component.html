<div [@routeAnimation] class="card card--panel perm-wrapper">
  <header class="perm-head perm-head--left" role="region" aria-label="Sección: Servicios">
    <div class="perm-head__icon" aria-hidden="true">
      <mat-icon>design_services</mat-icon>
    </div>
    <div class="perm-head__text">
      <span class="eyebrow">Sección</span>
      <h2>{{ title }}</h2>
    </div>
    <nav class="perm-head__crumbs" aria-label="Ruta">
      <span class="crumb">Administración</span>
      <span class="sep">/</span>
      <span class="crumb">Servicios</span>
      <span class="sep">/</span>
      <span class="crumb active">Catálogo</span>
    </nav>
  </header>
  <div class="surface">
    <section class="perm-form-nc container-fluid py-4">
      <form [formGroup]="servicioForm" class="perm-form-body">
        <div class="row g-4">
          <div class="col-12 col-md-6">
            <label for="srvNombre" class="form-label perm-label">Nombre del servicio</label>
            <div class="input-group input-group-lg perm-ig">
              <span class="input-group-text">
                <mat-icon aria-hidden="true">label</mat-icon>
              </span>
              <div class="form-floating flex-grow-1">
                <input
                  type="text"
                  autocomplete="off"
                  formControlName="nombre"
                  class="form-control"
                  id="srvNombre"
                  placeholder=" "
                  maxlength="200"
                />
                <label for="srvNombre">Ej.: Internet</label>
              </div>
            </div>
          </div>
        </div>
        <div class="d-flex flex-wrap gap-3 justify-content-start mt-4">
          <button type="button" class="button-success" role="button" (click)="submit()" [disabled]="loading">
            <i class="fa fa-check"></i>&nbsp;&nbsp;{{ submitButton }}
          </button>
          <button type="button" class="button-danger" (click)="regresar()">
            <i class="fa fa-times">&nbsp;&nbsp;</i>Cancelar
          </button>
        </div>
      </form>
    </section>
  </div>
</div>
