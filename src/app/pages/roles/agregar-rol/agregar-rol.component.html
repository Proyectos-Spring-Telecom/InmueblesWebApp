<div [@routeAnimation] class="card card--panel perm-wrapper">
    <app-module-hero icon="supervisor_account" eyebrow="Administración" titulo="Rol"
      descripcion="Captura el rol y asígnale sus permisos. Los campos con * son obligatorios."></app-module-hero>
    <div class="surface">
        <section class="perm-form-nc container-fluid py-4">
            <form [formGroup]="rolForm" class="perm-form-body">
                <div class="row g-4">
                    <div class="col-12 col-md-6">
                        <label for="permNombre" class="form-label perm-label">Nombre</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">title</mat-icon>
                            </span>
                            <div class="form-floating flex-grow-1">
                                <input type="text" formControlName="nombre" class="form-control" id="permNombre" placeholder="Ej.: SA" required>
                                <label for="permNombre">Ej.: SA</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="permClave" class="form-label perm-label">Descripción</label>
                        <div class="input-group input-group-lg perm-ig">
                            <span class="input-group-text fw-bold">
                                <mat-icon aria-hidden="true">description</mat-icon>
                            </span>
                            <div class="form-floating flex-grow-1">
                                <input type="text" formControlName="descripcion" class="form-control" id="permClave" placeholder="Ej.: Gestor de todo el sistema " required>
                                <label for="permClave">Ej.: Gestor de todo el sistema</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-3 justify-content-start mt-4">
                    <button class="button-success" role="button" (click)="submit()"><i
                            class="fa fa-check"></i>&nbsp;&nbsp;{{submitButton}}</button>
                    <button type="button" class="button-danger" (click)="regresar()"><i
                            class="fa fa-times">&nbsp;&nbsp;</i>Cancelar</button>
                </div>
            </form>
        </section>
    </div>
</div>
